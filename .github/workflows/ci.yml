name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 #v10.3.3
        with:
          version: "0.11.6"
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-install-project --group ci

      - name: Lint Code
        run: uv run ruff check stwfsapy

      - name: Test Black Code Style compliance
        run: uv run black . --check --diff

      - name: Test Code
        run: uv run pytest --cov=stwfsapy --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.python-version == '3.11'

      - name: Look for security vulnerabilities in dependencies
        run: uv run safety check --full-report
        continue-on-error: true

      - name: Look for security issues in code
        run: uv run bandit -c pyproject.toml -r stwfsapy
        continue-on-error: true
