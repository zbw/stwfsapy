[project]
name = "stwfsapy"
version = "0.7.1-dev"
description = "A library for match labels of thesaurus concepts to text and assigning scores to found occurrences."
authors = [{name ="AutoSE", email = "autose@zbw.eu"}]
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies=[
    "scipy>=1.16.2,<2.0",
    "scikit-learn>=1.9.1,<2.0",
    "rdflib~=7.5.0"
]

[project.urls]
homepage = "https://github.com/zbw/stwfsapy"
documentation = "https://stwfsapy-zbw.readthedocs.io"


[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "pytest-mock~=3.15.0",
    "black~=26.3.1",
    "pre-commit~=4.5.0",
]
ci = [
    "pytest-cov~=6.2.0",
    "ruff~=0.14.0",
    "safety~=3.8.0",
    "bandit~=1.9.0",
]

[tool.uv.build-backend]
module-name = "stwfsapy"
module-root = ""

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I"
]

[tool.bandit]
skips = ["B403", "B301"]
exclude_dirs = ["stwfsapy/tests"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"
